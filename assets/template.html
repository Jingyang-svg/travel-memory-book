<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅行纪念册 · Travel Memory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6E68'/%3E%3Ccircle cx='16' cy='16' r='7.2' fill='none' stroke='%23ECE8DF' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23E07A5F'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* ============ 设计 Token ============ */
:root{
  --paper:#ECE8DF; --paper-2:#E4DFD3; --paper-3:#DCD6C8;
  --ink:#211F1A; --ink-soft:#5B564B; --ink-faint:#857E6F;
  --line:#C7BFAF; --line-soft:#D5CFBF;
  --teal:#2E6E68; --teal-deep:#1E4E49; --teal-soft:#DCE8E4;
  --cinnabar:#C2543A;
  --shadow:0 14px 40px -18px rgba(33,31,26,.45);
  --serif-cn:"Noto Serif SC",serif;
  --sans-cn:"Noto Sans SC",system-ui,sans-serif;
  --disp:"DM Serif Display","Noto Serif SC",serif;
  --spec:"Spectral","Noto Serif SC",serif;
}
[data-theme="dark"]{
  --paper:#181714; --paper-2:#211F1A; --paper-3:#292722;
  --ink:#EAE5D8; --ink-soft:#A29C8D; --ink-faint:#767063;
  --line:#35332B; --line-soft:#2B2923;
  --teal:#74B8B0; --teal-deep:#8FC9C1; --teal-soft:#24342F;
  --cinnabar:#E07A5F;
  --shadow:0 16px 44px -16px rgba(0,0,0,.7);
}
/* ============ Reset ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans-cn);font-weight:400;line-height:1.75;
  font-size:16px;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .5s ease,color .5s ease;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--teal);color:var(--paper)}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
/* 胶片颗粒 */
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.05;mix-blend-mode:multiply}
[data-theme="dark"] .grain{mix-blend-mode:screen;opacity:.07}
/* 主题切换 */
.theme-btn{position:fixed;top:18px;right:18px;z-index:70;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.theme-btn svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.6}
/* ============ 封面 ============ */
.cover{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(28px,6vw,64px);position:relative;overflow:hidden}
.cover .kicker{font-family:var(--sans-cn);font-size:12px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500}
.cover .kicker .dot{color:var(--cinnabar);margin:0 .5em}
.cover-main{margin:auto 0;padding:6vh 0}
.cover h1{font-family:var(--disp);font-weight:400;line-height:.98;
  font-size:clamp(34px,10.5vw,130px);letter-spacing:-.01em}
.cover h1 .cn{display:block;font-family:var(--serif-cn);font-weight:900;
  font-size:clamp(38px,8.6vw,96px);letter-spacing:.06em;margin-top:.12em}
.cover h1 .x{color:var(--cinnabar);font-style:italic;padding:0 .04em}
.cover .meta-row{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:baseline;margin-top:clamp(28px,5vh,52px)}
.cover .range{font-family:var(--spec);font-size:clamp(17px,2.4vw,22px);color:var(--ink)}
.cover .tag{font-size:13px;letter-spacing:.18em;color:var(--ink-soft);font-weight:500;
  border:1px solid var(--line);padding:5px 13px;border-radius:40px}
.cover-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  border-top:1px solid var(--line);padding-top:20px}
.cover-foot .authors{font-family:var(--serif-cn);font-weight:700;font-size:clamp(18px,2.6vw,24px);letter-spacing:.08em}
.cover-foot .hint{font-size:12px;color:var(--ink-faint);letter-spacing:.14em;text-align:right} .cover-couple{flex:1 1 auto;display:flex;justify-content:center;align-items:flex-end;min-width:0} .cover-couple img{height:clamp(60px,8.5vw,92px);width:auto;display:block}[data-theme="dark"] .cover-couple img{filter:invert(1)}
.cover .wave{position:absolute;right:0;bottom:16vh;width:clamp(180px,30vw,400px);opacity:.55;
  fill:none;stroke:var(--teal);stroke-width:1.4}
.cover .kicker,.cover-main,.cover-foot{animation:rise .95s cubic-bezier(.22,1,.36,1) both}
.cover-main{animation-delay:.12s}.cover-foot{animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
/* ============ 章节（每天） ============ */
.day{padding:clamp(56px,10vh,108px) clamp(20px,6vw,64px);max-width:1180px;margin:0 auto;border-top:1px solid var(--line)}
.day-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:clamp(22px,4vh,38px)}
.day-d{font-family:var(--disp);font-size:clamp(30px,5vw,46px);color:var(--teal);line-height:1}
.day-date{font-family:var(--spec);font-size:clamp(17px,2.4vw,21px)}
.day-city{font-size:12px;letter-spacing:.22em;color:var(--ink-soft);border:1px solid var(--line);
  padding:3px 11px;border-radius:30px;margin-left:auto}
.day-title{font-family:var(--serif-cn);font-weight:700;font-size:clamp(25px,4.6vw,42px);letter-spacing:.04em;margin-bottom:10px}
.hero-slot{margin:6px 0 clamp(26px,5vh,42px)}
.day-story{font-family:var(--spec);font-size:clamp(17px,2.4vw,20px);line-height:1.95;max-width:62ch;margin-bottom:18px}
.day-story .drop{font-family:var(--disp);font-size:3.1em;float:left;line-height:.82;padding:.05em .12em 0 0;color:var(--cinnabar)}
.story-pending{font-family:var(--spec);font-style:italic;color:var(--ink-faint);border-left:2px solid var(--cinnabar);
  padding:6px 0 6px 16px;font-size:15px;max-width:52ch;margin-bottom:18px}
.day-places{font-size:14px;letter-spacing:.05em;color:var(--ink-soft);line-height:1.95;margin-bottom:clamp(26px,4vh,38px)}
.day-places b{color:var(--teal);font-weight:500;margin-right:5px}
/* 碎片小事折叠 */
.bits{margin:4px 0 22px;border:1px solid var(--line);border-radius:6px;background:var(--paper-2);padding:0 16px}
.bits summary{cursor:pointer;padding:13px 0;font-size:14px;letter-spacing:.1em;color:var(--teal-deep);
  display:flex;justify-content:space-between;align-items:center;list-style:none}
[data-theme="dark"] .bits summary{color:var(--teal)}
.bits summary::-webkit-details-marker{display:none}
.bits summary::after{content:"+";font-size:19px;color:var(--ink-faint);line-height:1}
.bits[open] summary::after{content:"−"}
.bits ul{list-style:none;padding:2px 0 15px;display:grid;gap:9px}
.bits li{position:relative;padding-left:19px;font-size:14px;color:var(--ink-soft);line-height:1.7}
.bits li::before{content:"";position:absolute;left:2px;top:.74em;width:6px;height:1.5px;background:var(--cinnabar)}
/* 照片网格 */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.5vw,18px);grid-auto-flow:dense}
.photo{position:relative;overflow:hidden;border-radius:3px;background:var(--paper-3);cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:3/4;transition:transform .5s ease}
.photo:hover img{transform:scale(1.045)}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 9px;font-size:12px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.62));opacity:0;transition:opacity .3s}
.photo:hover .cap{opacity:1}
.photo.w-2{grid-column:span 2}.photo.w-3{grid-column:span 3}.photo.w-4{grid-column:span 4}.photo.w-6{grid-column:span 6}
.photo.landscape img{aspect-ratio:4/3}.photo.wide img,.photo.w-6 img{aspect-ratio:16/9}
/* 待冲印胶片位 */
.slot{position:relative;border:1px dashed var(--line);background:var(--paper-2);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  min-height:170px;color:var(--ink-faint);padding:24px;text-align:center}
.slot::before,.slot::after{content:"";position:absolute;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--paper) 0 8px,transparent 8px 16px)}
.slot::before{top:-1px}.slot::after{bottom:-1px}
.slot svg{width:30px;height:30px;fill:none;stroke:var(--teal);stroke-width:1.4}
.slot .lab{font-size:12px;letter-spacing:.16em}
.slot.hero{min-height:clamp(280px,50vw,500px)}
.slot.hero .big{font-family:var(--serif-cn);font-size:clamp(20px,3vw,28px);color:var(--ink-soft);font-weight:600}
.slot.w-2{grid-column:span 2}.slot.w-3{grid-column:span 3}.slot.w-4{grid-column:span 4}.slot.w-6{grid-column:span 6}
/* ============ 万能专栏 ============ */
.section{padding:clamp(64px,11vh,118px) clamp(20px,6vw,64px);max-width:1180px;margin:0 auto;border-top:1px solid var(--line)}
.sec-kicker{display:flex;align-items:baseline;gap:16px;margin-bottom:clamp(28px,5vh,50px)}
.sec-kicker .no{font-family:var(--disp);font-size:clamp(26px,4vw,40px);color:var(--cinnabar)}
.sec-kicker h2{font-family:var(--serif-cn);font-weight:700;font-size:clamp(23px,4.4vw,38px);letter-spacing:.05em}
.best{position:relative;border-radius:4px;overflow:hidden;cursor:zoom-in;background:var(--paper-3)}
.best img{width:100%;max-height:86vh;object-fit:cover}
.best .cap{padding:15px 4px;font-family:var(--spec);font-style:italic;color:var(--ink-soft);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{background:var(--paper);padding:clamp(24px,4vw,42px) clamp(18px,3vw,32px)}
.stat .n{font-family:var(--disp);font-size:clamp(32px,6vw,58px);line-height:1;color:var(--teal-deep)}
[data-theme="dark"] .stat .n{color:var(--teal)}
.stat .label{font-size:13px;color:var(--ink-soft);margin-top:11px;letter-spacing:.05em}
.stat.wide{grid-column:span 2}
.quotes{display:flex;flex-direction:column;gap:clamp(28px,5vh,46px)}
.quote blockquote{font-family:var(--serif-cn);font-weight:600;font-size:clamp(20px,3.4vw,31px);line-height:1.55;max-width:24ch}
.quote blockquote::before{content:"“";color:var(--cinnabar);font-family:var(--disp);font-size:1.35em;margin-right:.04em}
.quote blockquote::after{content:"”";color:var(--cinnabar);font-family:var(--disp);font-size:1.35em;margin-left:.02em}
.quote figcaption{font-size:13px;color:var(--ink-faint);margin-top:9px;letter-spacing:.1em} .quote blockquote.one-line{white-space:nowrap;max-width:none;margin-left:auto;margin-right:auto;text-align:center;font-size:clamp(13px,3.6vw,26px);line-height:1.3} .smiles{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(10px,2.6vw,24px);margin-top:clamp(26px,5vh,42px)} .smile{width:clamp(30px,7.5vw,42px);height:auto;color:var(--teal-deep);fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}[data-theme="dark"] .smile{color:var(--teal)}
.capsule{background:var(--teal-soft);border-radius:6px;padding:clamp(32px,6vw,60px);display:grid;gap:16px}
.capsule .q{font-family:var(--serif-cn);font-weight:700;font-size:clamp(21px,3.4vw,30px)}
.capsule .a{font-family:var(--spec);font-size:clamp(18px,2.6vw,22px);color:var(--teal-deep);min-height:1.5em}
[data-theme="dark"] .capsule .a{color:var(--teal)}
.capsule .a.empty{color:var(--ink-faint);font-style:italic}
/* ============ 结尾 ============ */
.ending{min-height:68vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:clamp(48px,9vh,96px) clamp(24px,6vw,64px);gap:22px;border-top:1px solid var(--line)}
.ending .line-word{font-family:var(--serif-cn);font-weight:700;font-size:clamp(25px,5vw,50px);line-height:1.4;max-width:20ch}
.ending .fin{font-family:var(--disp);font-size:clamp(20px,3vw,28px);color:var(--cinnabar)}
.ending .small{font-size:12px;letter-spacing:.2em;color:var(--ink-faint)}
/* ============ 灯箱 ============ */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(15,14,11,.95);display:none;align-items:center;justify-content:center;padding:clamp(14px,4vw,48px)}
.lightbox.open{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0}}
.lightbox img{max-width:100%;max-height:80vh;border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb-cap{position:absolute;bottom:clamp(18px,4vh,38px);left:0;right:0;text-align:center;color:#ECE8DF;font-family:var(--spec);font-size:15px;font-style:italic;padding:0 24px}
.lb-btn{position:absolute;z-index:2;width:48px;height:48px;border-radius:50%;color:#ECE8DF;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.12)}
.lb-btn svg{width:24px;height:24px;fill:none;stroke:#ECE8DF;stroke-width:1.6}
.lb-close{top:18px;right:18px}.lb-prev{left:12px;top:50%;transform:translateY(-50%)}.lb-next{right:12px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;top:24px;left:24px;font-size:13px;letter-spacing:.14em;color:#B7B0A0}
/* ============ 响应式 ============ */
@media(max-width:760px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .photo.w-3,.photo.w-4,.photo.w-6{grid-column:span 4}
  .slot.w-2,.slot.w-3,.slot.w-4,.slot.w-6{grid-column:span 4}
  .stats{grid-template-columns:repeat(2,1fr)}
  .day-city{margin-left:0}
  .cover-foot{flex-direction:column;align-items:flex-start;gap:10px}.cover-foot .hint{text-align:left}.cover-couple{width:100%;justify-content:flex-start;flex:none}.cover-couple img{height:70px}
  .lb-prev{left:2px}.lb-next{right:2px}
}
@media(max-width:420px){.stats{grid-template-columns:1fr}.stat.wide{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ========== 五项增强：追加样式 ========== */
/* --- 手绘地图配色（按天柔和，胶片纸感） --- */
:root{
  --c1:#BE9650; --c2:#7E95A8; --c3:#4C92A5; --c4:#8B9A5E; --c5:#2E6E68; --c6:#BE563E;
  --accent:#2E6E68;
  --map-bg:#E9E4D8; --sea:#D3E0DD; --land:#F0EBE1; --coast:#B5C5C1; --river:#B2C9C4;
  --surface:#ECE8DF; --map-fly:#928B7C;
}
[data-theme="dark"]{
  --c1:#D4AE68; --c2:#94ABBD; --c3:#66AABD; --c4:#A3B175; --c5:#74B8B0; --c6:#E07A5F;
  --accent:#74B8B0;
  --map-bg:#201E1A; --sea:#1B2928; --land:#26241F; --coast:#3C4A47; --river:#314F49;
  --surface:#211F1A; --map-fly:#867F71;
}
/* --- 封面磨砂背景（最佳一张） --- */
.cover-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.cover-bg img{width:100%;height:100%;object-fit:cover;
  filter:blur(38px) saturate(.95) brightness(1.02);transform:scale(1.18);opacity:.68}
.cover-bg-veil{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 76%,transparent),
  color-mix(in srgb,var(--paper) 58%,transparent) 46%,color-mix(in srgb,var(--paper) 82%,transparent))}
[data-theme="dark"] .cover-bg img{opacity:.5}
[data-theme="dark"] .cover-bg-veil{
  background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 84%,transparent),
  color-mix(in srgb,var(--paper) 70%,transparent) 46%,color-mix(in srgb,var(--paper) 86%,transparent))}
.cover .kicker,.cover-mid,.cover .cover-foot{position:relative;z-index:2}
/* --- 封面中块（标题 + 总览图） --- */
.cover-mid{margin:auto 0;width:100%;display:flex;flex-direction:column;
  gap:clamp(16px,3vh,36px)}
.cover .cover-main{margin:0;padding:0}
.cover .wave{z-index:1;opacity:.3}
/* --- 双城手绘总览图 --- */
.ovmap{width:100%;max-width:1000px;margin:0 auto}
.ovmap-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.ovmap-tab{font-size:12px;letter-spacing:.12em;padding:6px 18px;border-radius:30px;
  border:1px solid var(--line);color:var(--ink-soft);
  background:color-mix(in srgb,var(--paper) 58%,transparent);transition:all .25s}
.ovmap-tab.active{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.ovmap-box{border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;
  background:color-mix(in srgb,var(--paper) 50%,transparent);box-shadow:var(--shadow);
  aspect-ratio:1000/467;height:auto}
.ovmap-box.city-pk{aspect-ratio:900/900}
.ovmap-box svg{width:100%;height:100%;display:block}
.ovmap-legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:14px}
.ovmap-legend span{font-size:11px;letter-spacing:.04em;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:6px}
.ovmap-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.map-lbl{font-family:var(--sans-cn);font-size:15px;fill:var(--ink);font-weight:500}
.map-flytxt{font-family:var(--sans-cn);font-size:14px;fill:var(--map-fly);letter-spacing:.03em}
.map-n{font-family:var(--disp);font-size:18px;fill:var(--ink-soft)}
.mp,.map-lbl{cursor:default}
/* --- 每日整体折叠 --- */
.day-fold{border-radius:8px}
.day-summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;
  gap:8px 16px;position:relative;padding-right:48px}
.day-summary::-webkit-details-marker{display:none}
.day-summary .day-d{font-family:var(--disp);font-size:clamp(30px,5vw,46px);color:var(--teal);line-height:1}
.day-summary .day-date{font-family:var(--spec);font-size:clamp(17px,2.4vw,21px)}
.day-summary .day-city{font-size:12px;letter-spacing:.22em;color:var(--ink-soft);
  border:1px solid var(--line);padding:3px 11px;border-radius:30px;margin-left:auto}
.day-summary .day-title{flex:1 1 100%;font-family:var(--serif-cn);font-weight:700;
  font-size:clamp(25px,4.6vw,42px);letter-spacing:.04em;margin:2px 0 0}
.day-toggle{position:absolute;right:4px;top:0;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:20px;line-height:1}
.day-toggle::after{content:"+"}
.day-fold[open] .day-toggle::after{content:"−"}
.day-body{padding-top:clamp(18px,3vh,30px)}
.day-fold[open] .day-body{animation:dayin .42s cubic-bezier(.22,1,.36,1) both}
@keyframes dayin{from{opacity:0;transform:translateY(-6px)}}
/* --- 侧边导航（桌面右竖） --- */
.side-nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:65;
  display:flex;flex-direction:column;gap:9px;padding:10px 8px;border-radius:30px;
  border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 72%,transparent);
  backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.side-nav button{width:30px;height:30px;border-radius:50%;font-family:var(--spec);font-size:13px;
  color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:all .2s}
.side-nav button.active{background:var(--teal);color:var(--paper)}
.side-nav button:hover{color:var(--teal)}
.side-nav button.active:hover{color:var(--paper)}
/* --- 音乐按钮 --- */
.music-btn{position:fixed;top:18px;right:74px;z-index:70;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

<body>
<svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<script>
/* ===== 本册数据：构建时由 build_book.py 注入（每趟一份） ===== */
var BOOK=/*__BOOK__*/null;
if(BOOK)document.title=BOOK.meta.title+' · 旅行纪念册';
/* ===== 图标与工具 ===== */
const ICON_CAM='<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.6"/><path d="M8.2 7l1.4-2.6h4.8L15.8 7"/></svg>';

function partsX(s){return String(s).split('×').map(x=>x.trim())}
function joinX(a){return a.length>1?a[0]+'<span class="x">×</span>'+a[1]:a[0]}
/* ===== 封面 ===== */
/* ===== 封面（总览地图 / 小人 可选） ===== */
function coverHTML(m,bgSrc){
 return `<section class="cover">
  ${bgSrc?`<div class="cover-bg"><img src="${bgSrc}" alt=""></div>`:''}
  <div class="cover-bg-veil"></div>
  <div class="kicker">${esc(m.kicker||'A Travel Memoir · 旅行纪念册')}</div>
  <div class="cover-mid">
   <div class="cover-main">
    <h1>${joinX(partsX(m.en))}<span class="cn">${joinX(partsX(m.title))}</span></h1>
    <div class="meta-row"><span class="range">${m.range}</span><span class="tag">${m.days}</span></div>
   </div>
   ${BOOK.map?`
   <div class="ovmap">
    <div class="ovmap-tabs" id="ovmapTabs"></div>
    <div class="ovmap-box" id="ovmapBox"></div>
    <div class="ovmap-legend" id="ovmapLegend"></div>
   </div>`:''}
  </div>
  <svg class="wave" viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M0 60c50-42 100-42 150 0s100 42 150 0 80-32 100-6"/></svg>
  <div class="cover-foot"><div class="authors">${m.authors}</div>${m.couple?`<div class="cover-couple"><img src="assets/couple.png" alt="${esc(m.authors)}"></div>`:''}<div class="hint">向下滑动，开始回忆</div></div>
 </section>`;
}
/* ===== 每天 ===== */
function photoHTML(p){
 return `<div class="photo ${p.span||'w-2'} ${p.shape==='landscape'?'landscape':''} ${p.shape==='wide'?'wide':''}" data-photo>
  <img src="${p.src}" alt="${esc(p.cap||'')}" loading="lazy">${p.cap?`<div class="cap">${p.cap}</div>`:''}</div>`;
}
function dayHTML(d,i){
 const hero=d.cover
  ?`<div class="hero-slot"><div class="photo w-6 wide" data-photo><img src="${d.cover.src}" alt="${esc(d.cover.cap||d.title)}">${d.cover.cap?`<div class="cap">${d.cover.cap}</div>`:''}</div></div>`
  :`<div class="hero-slot"><div class="slot hero">${ICON_CAM}<div class="big">${d.title} · 待冲印</div><div class="lab">DAY COVER · 当天封面</div></div></div>`;
 const story=d.story?`<p class="day-story">${d.story}</p>`
  :`<p class="story-pending">那天的故事还空着——你随手写几句发我，或我按照片先代拟、由你核对。</p>`;
 const bits=(d.bits&&d.bits.length)?`<details class="bits"><summary>那天的碎片小事 · ${d.bits.length}</summary><ul>${d.bits.map(x=>`<li>${x}</li>`).join('')}</ul></details>`:'';
 const places=`<div class="day-places"><b>那天去了</b>${d.places}</div>`;
 let grid;
 if(d.photos&&d.photos.length){grid=`<div class="grid">${d.photos.map(photoHTML).join('')}</div>`;}
 else{grid=`<div class="grid">
  <div class="slot w-3 landscape">${ICON_CAM}<div class="lab">待冲印 · 横图</div></div>
  <div class="slot w-3">${ICON_CAM}<div class="lab">待冲印 · 竖图</div></div>
  <div class="slot w-2">${ICON_CAM}<div class="lab">待冲印</div></div>
  <div class="slot w-2">${ICON_CAM}<div class="lab">待冲印</div></div>
  <div class="slot w-2">${ICON_CAM}<div class="lab">待冲印</div></div></div>`;}
 return `<section class="day" id="day-${i+1}">
  <details class="day-fold">
   <summary class="day-summary">
    <span class="day-d">${d.d}</span><span class="day-date">${d.date} ${d.week}</span><span class="day-city">${d.city}</span>
    <h3 class="day-title">${d.title}</h3><span class="day-toggle"></span>
   </summary>
   <div class="day-body">${hero}${story}${bits}${places}${grid}</div>
  </details>
 </section>`;
}
/* ===== 万能专栏 ===== */
function bestHTML(b){return b?`<div class="best" data-photo><img src="${b.src}" alt="${esc(b.cap||'最佳一张')}"><div class="cap">${b.cap||''}</div></div>`
 :`<div class="slot" style="min-height:340px">${ICON_CAM}<div class="big">最佳一张 · 待冲印</div><div class="lab">挑出这趟最爱的一张照片</div></div>`;}
function statsHTML(s){return `<div class="stats">${s.map(x=>`<div class="stat${x.wide?' wide':''}"><div class="n">${x.n}</div><div class="label">${x.label}</div></div>`).join('')}</div>`;}
const SMILES_ROW='<div class="smiles"><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M13 16.5q2-3.2 4 0"/><path d="M23 16.5q2-3.2 4 0"/><path d="M13 23.5q7 8.5 14 0"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><circle cx="15" cy="16" r="1.7" fill="currentColor" stroke="none"/><circle cx="25" cy="16" r="1.7" fill="currentColor" stroke="none"/><path d="M14 23.5q6 5.5 12 0"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><circle cx="15" cy="16" r="1.7" fill="currentColor" stroke="none"/><path d="M23 16q2 2.2 4 0"/><path d="M14 23.5q6 5.5 12 0"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M13 16.5q2-3.2 4 0"/><path d="M23 16.5q2-3.2 4 0"/><path d="M14 23q6 5 12 0"/><path d="M18 24.5v3.6q2 1.8 4 0v-3.6"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M15 18.4C11.7 15.9 11.2 13.7 12.9 12.9C14 12.4 15 13.1 15 14C15 13.1 16 12.4 17.1 12.9C18.8 13.7 18.3 15.9 15 18.4Z"/><path d="M25 18.4C21.7 15.9 21.2 13.7 22.9 12.9C24 12.4 25 13.1 25 14C25 13.1 26 12.4 27.1 12.9C28.8 13.7 28.3 15.9 25 18.4Z"/><path d="M14 23.5q6 5.5 12 0"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><circle cx="15" cy="15.5" r="1.7" fill="currentColor" stroke="none"/><circle cx="25" cy="15.5" r="1.7" fill="currentColor" stroke="none"/><circle cx="20" cy="26" r="3.1"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M10.5 15h8v3.4q-4 1.5-8 0Z" fill="currentColor" stroke="none"/><path d="M21.5 15h8v3.4q-4 1.5-8 0Z" fill="currentColor" stroke="none"/><path d="M18.5 16h3"/><path d="M14.5 26q5.5 2.6 11 0"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M13 16.5q2-3.2 4 0"/><path d="M23 16.5q2-3.2 4 0"/><path d="M14 23.5q6 5.5 12-1.5"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M13 15.5q2 2.4 4 0"/><path d="M23 15.5q2 2.4 4 0"/><path d="M20 28.2C18.1 26.7 17.8 25.3 18.9 24.8C19.6 24.5 20 25 20 25.5C20 25 20.4 24.5 21.1 24.8C22.2 25.3 21.9 26.7 20 28.2Z"/></svg><svg class="smile" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M13 16.5q2-3.2 4 0"/><path d="M23 16.5q2-3.2 4 0"/><path d="M12.5 22.5q7.5 10 15 0Z"/><path d="M15.2 25.6h9.6"/></svg></div>';
function quotesHTML(q){
 if(q&&q.length)return `<div class="quotes">${q.map(x=>`<figure class="quote"><blockquote class="one-line">${x.q}</blockquote>${x.who?`<figcaption>— ${x.who}</figcaption>`:''}</figure>`).join('')}${SMILES_ROW}</div>`;
 return `<div class="quotes">
  <figure class="quote"><blockquote style="color:var(--ink-faint);font-weight:400;font-style:italic">（待补充：旅途中印象最深的一句话）</blockquote></figure>
  <figure class="quote"><blockquote style="color:var(--ink-faint);font-weight:400;font-style:italic">（待补充：最好笑的一个瞬间）</blockquote></figure></div>`;
}
function capsuleHTML(c){return `<div class="capsule"><div class="q">${c.q}</div><div class="a ${c.a?'':'empty'}">${c.a||'留给下一次出发前填写'}</div></div>`;}
function sectionsHTML(B){
 const sec=(no,h,body)=>`<section class="section"><div class="sec-kicker"><span class="no">${no}</span><h2>${h}</h2></div>${body}</section>`;
 return sec('01','最佳一张',bestHTML(B.best))+sec('02','数字回顾',statsHTML(B.stats))
  +sec('03','金句与笑声',quotesHTML(B.quotes))+sec('04','时间胶囊',capsuleHTML(B.capsule));
}
function endingHTML(m){
 return `<section class="ending">
  <div class="line-word" ${BOOK.ending?'':'style="color:var(--ink-faint);font-weight:500;font-size:.78em"'}>${BOOK.ending||'（这一程的总结，留给你写一句话）'}</div>
  <div class="fin">To be continued</div><div class="small">${m.range} · ${m.authors}</div></section>`;
}
document.getElementById('app').innerHTML=
 coverHTML(BOOK.meta,BOOK.best?BOOK.best.src:'')+BOOK.days.map((d,i)=>dayHTML(d,i)).join('')+sectionsHTML(BOOK)+endingHTML(BOOK.meta);
/* ===== 封面手绘总览地图：通用引擎（点位 / 路线 / 视图数据来自 BOOK.map） ===== */
var D2R=Math.PI/180;
function mercXY(lat,lng){return [lng*D2R, Math.log(Math.tan(Math.PI/4+lat*D2R/2))];}
var MIC={plane:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5C13 2.7 12.3 2 11.5 2S10 2.7 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
 boat:'<svg viewBox="0 0 24 24"><path d="M12 2v4M5 11l1.6 6.2c.2.8.8 1.3 1.6 1.3h7.6c.8 0 1.4-.5 1.6-1.3L19 11M4 11h16l-1.4-2.2H5.4zM12 17.5V21M9 21h6"/></svg>'};
function makeProj(cfg){
 var a=mercXY(cfg.latMin,cfg.lngMin),b=mercXY(cfg.latMax,cfg.lngMax);
 var x0=a[0],x1=b[0],yHi=b[1],yLo=a[1],iw=cfg.W-2*cfg.pad,ih=cfg.H-2*cfg.pad;
 return function(lat,lng){var m=mercXY(lat,lng);
  return [cfg.pad+(m[0]-x0)/(x1-x0)*iw, cfg.pad+(yHi-m[1])/(yHi-yLo)*ih];};
}
function ringPath(ring,P){
 return 'M'+ring.map(function(q){var xy=P(q[1],q[0]);return xy[0].toFixed(1)+' '+xy[1].toFixed(1);}).join(' L ')+' Z';
}
function smooth(pts){
 if(pts.length<2)return '';
 var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
 for(var i=0;i<pts.length-1;i++){
  var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
  var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
  var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
  d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
 }
 return d;
}
function compass(x,y){
 return '<g opacity=".7"><circle cx="'+x+'" cy="'+y+'" r="20" fill="none" stroke="var(--line)" stroke-width="1.6"/>'+
 '<path d="M'+x+' '+(y-15)+' L'+(x+5)+' '+y+' L'+x+' '+(y+15)+' L'+(x-5)+' '+y+' Z" fill="var(--accent)"/>'+
 '<text x="'+x+'" y="'+(y-25)+'" text-anchor="middle" class="map-n">N</text></g>';
}
function icoAt(icSvg,x,y,size,fill){
 return '<svg x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+fill+'">'+icSvg.replace(/<svg[^>]*>/,"").replace("</svg>","")+'</svg>';
}
function citySVG(cd){
 var cfg=cd.view,P=makeProj(cfg),edge=cd.edge||{};
 var PM={};(cd.points||[]).forEach(function(q){PM[q.id]=q;});
 function C(id){if(edge[id])return edge[id].slice();var q=PM[id];return P(q.lat,q.lng);}
 var lines=cd.lines||[];
 var ids={};lines.forEach(function(l){l.ids.forEach(function(id){ids[id]=1;});});
 var adj=cd.labelAdj||{},minor={};(cd.minor||[]).forEach(function(id){minor[id]=1;});
 var isletIds={};(cd.islets||[]).forEach(function(it){if(it.id)isletIds[it.id]=1;});
 function lcolor(id){for(var i=0;i<lines.length;i++){if(lines[i].ids.indexOf(id)>=0)return lines[i].c;}return 'var(--accent)';}
 function marker(xy,id){
  var x=xy[0],y=xy[1],kd=PM[id]?PM[id].kind:null,col=lcolor(id),s='';
  if(kd==='airport'){
   s+='<g class="mp" data-nav="'+id+'"><circle class="mp-hit" cx="'+x+'" cy="'+y+'" r="20" fill="transparent"/>';
   s+='<rect x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26" rx="7" fill="var(--ink-soft)" opacity=".88"/>';
   s+='<g transform="translate('+(x-9)+','+(y-9)+') scale(.78)"><path d="M21 16v-2l-8-5V3.5C13 2.7 12.3 2 11.5 2S10 2.7 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#fff"/></g></g>';
   return s;}
  if(kd==='hotel'){
   s+='<g class="mp" data-nav="'+id+'"><circle class="mp-hit" cx="'+x+'" cy="'+(y-7)+'" r="18" fill="transparent"/>';
   s+='<line x1="'+x+'" y1="'+(y+2)+'" x2="'+x+'" y2="'+(y-22)+'" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round"/>';
   s+='<path d="M'+x+' '+(y-22)+' L'+(x+17)+' '+(y-17)+' L'+x+' '+(y-12)+' Z" fill="'+col+'"/>';
   s+='<circle cx="'+x+'" cy="'+(y+2)+'" r="4.5" fill="var(--surface)" stroke="'+col+'" stroke-width="2.4"/></g>';
   return s;}
  s+='<g class="mp" data-nav="'+id+'"><circle class="mp-hit" cx="'+x+'" cy="'+y+'" r="17" fill="transparent"/>';
  s+='<circle cx="'+x+'" cy="'+y+'" r="6.2" fill="var(--surface)" stroke="'+col+'" stroke-width="3"/></g>';
  return s;
 }
 function label(xy,id){
  var a=adj[id]||[12,4,'start'];
  return '<text x="'+(xy[0]+a[0])+'" y="'+(xy[1]+a[1])+'" text-anchor="'+a[2]+'" class="map-lbl" data-pid="'+id+'">'+PM[id].n+'</text>';
 }
 function flyLayer(){
  var s='<g>';
  (cd.fly||[]).forEach(function(f){
   var p0=C(f.id);
   s+='<path d="M'+p0[0].toFixed(0)+' '+p0[1].toFixed(0)+' L'+f.at[0]+' '+f.at[1]+'" stroke="var(--map-fly)" stroke-width="2.2" stroke-dasharray="4 6" fill="none" opacity=".82"/>';
   s+=icoAt(f.ic==='boat'?MIC.boat:MIC.plane,f.at[0]-11,f.at[1]-11,22,'var(--map-fly)');
   if(f.boat)s+='<text x="'+(f.at[0]+15)+'" y="'+(f.at[1]+5)+'" class="map-flytxt" text-anchor="start">'+f.txt+'</text>';
   else s+='<text x="'+f.at[0]+'" y="'+(f.at[1]+27)+'" class="map-flytxt" text-anchor="middle">'+f.txt+'</text>';
  });
  return s+'</g>';
 }
 var s='<svg viewBox="0 0 '+cfg.W+' '+cfg.H+'" role="img" aria-label="'+esc(cd.tab)+'路线图">';
 s+='<rect x="2" y="2" width="'+(cfg.W-4)+'" height="'+(cfg.H-4)+'" rx="16" fill="'+(cd.sea?'var(--sea)':'var(--map-bg)')+'"/>';
 if(cd.sea){
  var fid='fade-'+cd.id,mid2='mask-'+cd.id;
  s+='<defs><radialGradient id="'+fid+'" cx="0.5" cy="0.47" r="0.8"><stop offset="0.58" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="'+mid2+'"><rect x="0" y="0" width="'+cfg.W+'" height="'+cfg.H+'" fill="url(#'+fid+')"/></mask></defs>';
  (cd.polygons||[]).forEach(function(r){s+='<path d="'+ringPath(r,P)+'" fill="var(--land)" stroke="var(--coast)" stroke-width="1.6" mask="url(#'+mid2+')"/>';});
  (cd.islets||[]).forEach(function(it){s+='<ellipse cx="'+it.at[0]+'" cy="'+it.at[1]+'" rx="'+it.rx+'" ry="'+it.ry+'" fill="var(--land)" stroke="var(--coast)" stroke-width="1.4"/>';});
 }else if(cd.river){
  s+='<path d="'+smooth(cd.river.map(function(q){return P(q[0],q[1]);}))+'" fill="none" stroke="var(--river)" stroke-width="10" opacity=".5" stroke-linecap="round"/>';
 }
 s+=flyLayer();
 s+='<g>';
 lines.forEach(function(l){if(!l.dash){var gp=l.ids.map(C);
  s+='<path d="'+smooth(gp)+'" fill="none" stroke="'+l.c+'" stroke-width="9" opacity=".13" stroke-linecap="round" stroke-linejoin="round"/>';}});
 lines.forEach(function(l){var pp=l.ids.map(C);
  s+='<path d="'+smooth(pp)+'" fill="none" stroke="'+l.c+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".92" '+(l.dash?'stroke-dasharray="'+l.dash.join(' ')+'"':'')+'/>';});
 s+='</g><g>';
 Object.keys(ids).forEach(function(id){if(!isletIds[id])s+=marker(C(id),id);});
 s+='</g><g class="map-lbls">';
 Object.keys(ids).forEach(function(id){if(!minor[id]&&!isletIds[id])s+=label(C(id),id);});
 s+='</g>'+compass(cfg.W-46,48)+'</svg>';
 return s;
}
/* ===== 封面总览图：初始化（标签页 / 图例） ===== */
(function(){
 if(!BOOK.map)return;
 var cs=BOOK.map.cities||[];
 var tabs=document.getElementById('ovmapTabs'),box=document.getElementById('ovmapBox'),leg=document.getElementById('ovmapLegend');
 if(!tabs||!box)return;
 cs.forEach(function(cd,i){
  var t=document.createElement('button');t.type='button';t.className='ovmap-tab'+(i===0?' active':'');t.setAttribute('data-city',cd.id);t.textContent=cd.tab;
  tabs.appendChild(t);
  var d=document.createElement('div');d.id='omb-'+cd.id;if(i>0)d.style.display='none';d.innerHTML=citySVG(cd);
  box.appendChild(d);
 });
 (BOOK.map.legend||[]).forEach(function(x){
  var sp=document.createElement('span');sp.innerHTML='<i style="background:var(--'+x[0]+')"></i>'+x[1];leg.appendChild(sp);});
 tabs.querySelectorAll('.ovmap-tab').forEach(function(tab){
  tab.addEventListener('click',function(){
   tabs.querySelectorAll('.ovmap-tab').forEach(function(x){x.classList.remove('active');});
   tab.classList.add('active');
   var c=tab.getAttribute('data-city'),sel=null;
   cs.forEach(function(cd){if(cd.id===c)sel=cd;var d=document.getElementById('omb-'+cd.id);if(d)d.style.display=(cd.id===c)?'block':'none';});
   box.classList.toggle('city-pk',!!(sel&&sel.sea));
  });
 });
})();

/* ===== 每日侧边导航 ===== */
(function(){
 var sn=document.getElementById('sideNav');
 BOOK.days.forEach(function(d,i){
  var b=document.createElement('button');b.type='button';b.textContent=d.d;
  b.title=d.date+' '+d.week+' · '+d.title;b.setAttribute('data-day',i);
  b.addEventListener('click',function(){jumpDay(i);});
  sn.appendChild(b);
 });
 var btns=sn.querySelectorAll('button');
 function setActive(i){
  btns.forEach(function(x){x.classList.remove('active');});
  var b=sn.querySelector('[data-day="'+i+'"]');if(b)b.classList.add('active');
 }
 window.jumpDay=function(i){
  var sec=document.getElementById('day-'+(i+1));if(!sec)return;
  var det=sec.querySelector('.day-fold');if(det)det.open=true;
  setActive(i);
  sec.scrollIntoView({behavior:'smooth',block:'start'});
 };
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){
   es.forEach(function(e){
    if(e.isIntersecting){setActive(parseInt(e.target.id.replace('day-',''),10)-1);}
   });
  },{rootMargin:'-45% 0px -45% 0px',threshold:0});
  document.querySelectorAll('.day').forEach(function(s){io.observe(s);});
 }
})();

/* ===== 背景音乐（可选；首次交互后播放，可手动关闭） ===== */
(function(){
 var audio=document.getElementById('bgAudio'),btn=document.getElementById('musicBtn');
 if(!BOOK.meta.music){btn.style.display='none';audio.removeAttribute('src');return;}
 audio.src=BOOK.meta.music;
 function tryPlay(){var p=audio.play();if(p&&p.catch)p.catch(function(){arm();});}
 var armed=false;
 function arm(){
  if(armed)return;armed=true;
  var EV=['pointerdown','touchstart','keydown'];
  function go(e){
   if(e.target&&e.target.closest&&e.target.closest('#musicBtn'))return;
   EV.forEach(function(t){window.removeEventListener(t,go);});
   tryPlay();
  }
  EV.forEach(function(t){window.addEventListener(t,go,{passive:true});});
 }
 btn.addEventListener('click',function(e){
  e.stopPropagation();
  if(audio.paused||audio.ended){tryPlay();}else{audio.pause();}
 });
 audio.addEventListener('play',function(){btn.classList.add('playing');btn.title='点击关闭音乐';});
 audio.addEventListener('pause',function(){btn.classList.remove('playing');btn.title='播放背景音乐';});
 tryPlay();
})();

/* ===== 照片灯箱 ===== */
var gallery=[],cur=0;
document.querySelectorAll('[data-photo]').forEach(function(el){
 var img=el.querySelector('img'); if(!img)return;
 var capEl=el.querySelector('.cap');
 var item={src:img.src,cap:capEl?capEl.textContent:(img.alt||'')};
 var idx=gallery.push(item)-1;
 el.addEventListener('click',function(){openLB(idx);});
});
var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),
 lbCap=document.getElementById('lbCap'),lbCount=document.getElementById('lbCount');
var reduceMove=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function openLB(i){cur=i;lbImg.src=gallery[i].src;lbCap.textContent=gallery[i].cap||'';
 lbCount.textContent=(i+1)+' / '+gallery.length;lb.classList.add('open');document.body.style.overflow='hidden';
 lbImg.style.transition='';lbImg.style.transform='';lbImg.style.opacity='1';
 if(!reduceMove){try{lbImg.animate([{opacity:0},{opacity:1}],{duration:200});}catch(e){}}}
function closeLB(){lb.classList.remove('open');document.body.style.overflow='';
 lbDrag=false;lbImg.style.transition='';lbImg.style.transform='';lbImg.style.opacity='1';}
function step(d){if(!gallery.length)return;cur=(cur+d+gallery.length)%gallery.length;openLB(cur);}
document.getElementById('lbClose').addEventListener('click',closeLB);
document.getElementById('lbPrev').addEventListener('click',function(){step(-1);});
document.getElementById('lbNext').addEventListener('click',function(){step(1);});
lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
document.addEventListener('keydown',function(e){
 if(!lb.classList.contains('open'))return;
 if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);});
/* 左右滑动 / 鼠标拖拽切换（两侧按钮保留；move/up 走 document，无需捕获） */
lb.style.touchAction='pan-y';
lbImg.draggable=false;
lbImg.addEventListener('dragstart',function(e){e.preventDefault();});
var sx=0,sdx=0,lbDrag=false;
lb.addEventListener('pointerdown',function(e){
 if(e.target.closest&&e.target.closest('.lb-btn'))return;
 lbDrag=true;sx=e.clientX;sdx=0;lbImg.style.transition='none';
 e.preventDefault();
});
document.addEventListener('pointermove',function(e){
 if(!lbDrag)return;
 sdx=e.clientX-sx;
 lbImg.style.transform='translateX('+sdx+'px)';
 lbImg.style.opacity=String(Math.max(0.5,1-Math.abs(sdx)/(lb.clientWidth||1)));
});
function lbEnd(){
 if(!lbDrag)return;lbDrag=false;
 var w=lb.clientWidth||1,th=Math.max(48,w*0.14),dir=0;
 if(sdx>th)dir=-1;else if(sdx<-th)dir=1;
 lbImg.style.transition='transform .2s ease,opacity .2s ease';
 if(dir){lbImg.style.transform='translateX('+(dir>0?-w*0.6:w*0.6)+'px)';lbImg.style.opacity='0';
  setTimeout(function(){step(dir);},170);}
 else{lbImg.style.transform='';lbImg.style.opacity='1';}
}
document.addEventListener('pointerup',lbEnd);
document.addEventListener('pointercancel',function(){lbDrag=false;lbImg.style.transition='';lbImg.style.transform='';lbImg.style.opacity='1';});
/* ===== 昼夜配色 ===== */
var rootEl=document.documentElement,btn=document.getElementById('themeBtn'),icon=document.getElementById('themeIcon');
var MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
var SUN='<circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>';
function setTheme(t){rootEl.setAttribute('data-theme',t);try{localStorage.setItem('mem-theme',t);}catch(e){}
 icon.innerHTML=t==='dark'?SUN:MOON;}
var saved=null;try{saved=localStorage.getItem('mem-theme');}catch(e){}
setTheme(saved||'light');
btn.addEventListener('click',function(){setTheme(rootEl.getAttribute('data-theme')==='dark'?'light':'dark');});
</script>
